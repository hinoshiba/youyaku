name: 機能リクエスト / Feature request
description: 新機能・改善を提案する / Suggest an idea
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提案ありがとうございます。まず既存の Issue を検索して重複がないか確認してください。
        Youyaku は「オンデバイス完結・日本語重視の音声入力」を軸にしています。方向性に沿った提案だと採り入れやすいです。
  - type: checkboxes
    id: preflight
    attributes:
      label: 事前確認
      options:
        - label: 既存の Issue（Open / Closed）を検索し、重複がないことを確認した
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題・背景
      description: どんな場面で困っているか。「〜が欲しい」より「〜で困っている」から書くと伝わりやすいです。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する機能・挙動
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: 補足（対象プラットフォーム・モックなど）
    validations:
      required: false
