name: Deploy site (GitHub Pages)

# 配布サイト(http_dist)を GitHub Pages へデプロイする。
# DMG 本体は GitHub Releases にあり、ここで配信するのは HTML と
# Sparkle の更新フィード(download/appcast.xml)・version.txt だけ。
#
# トリガー:
#   - main への push で http_dist/ 配下(appcast.xml・version.txt を含む)が変わったとき
#   - Actions 画面からの手動実行(workflow_dispatch)
#
# 事前設定(初回のみ):
#   1. リポジトリ Settings → Pages → Build and deployment → Source を「GitHub Actions」にする。
#   2. カスタムドメイン youyaku.hinoshiba.com は http_dist/CNAME で指定済み。
#      DNS(Cloudflare)側で CNAME レコード youyaku → <ユーザー名>.github.io を「DNS only(グレー)」で作成する。

on:
  push:
    branches: [main]
    paths:
      - "http_dist/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# GITHUB_TOKEN に Pages デプロイ権限を与える
permissions:
  contents: read

# 同時デプロイを1つに制限(進行中があってもキャンセルせず順番に流す)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check policy and support anchors
        run: |
          python3 - <<'PYTHON'
          from html.parser import HTMLParser
          from pathlib import Path
          class Page(HTMLParser):
              ids = set()
              contacts = set()
              def handle_starttag(self, tag, attributes):
                  attrs = dict(attributes)
                  if 'id' in attrs: self.ids.add(attrs['id'])
                  if attrs.get('href', '').startswith('mailto:'):
                      self.contacts.add(attrs['href'])
          page = Page()
          page.feed(Path('http_dist/index.html').read_text())
          assert {'privacy', 'terms', 'support'} <= page.ids
          assert page.contacts == {'mailto:support@hinoshiba.com'}
          PYTHON

      - name: サイトを組み立て(開発用ドキュメントを除外)
        run: |
          mkdir -p _site
          cp -R http_dist/. _site/
          rm -f _site/download/README.md
          touch _site/.nojekyll

      - name: 更新フィードと配布物の到達性を確認
        run: |
          APPCAST=_site/download/appcast.xml
          if [ ! -f "$APPCAST" ]; then
            echo "::warning::download/appcast.xml がありません。アプリ内アップデートは動きません(証明書のある Mac で ./build.sh --dist)。"
            exit 0
          fi
          # フィードが指す DMG が実在するか。非公開リポジトリや未アップロードだと 404 になり、
          # 「更新は見えるのにダウンロードできない」状態でサイトが公開されてしまう。
          URL=$(grep -o 'url="[^"]*"' "$APPCAST" | head -1 | cut -d'"' -f2)
          echo "appcast の enclosure: $URL"
          if curl -sfL -o /dev/null --max-time 30 -r 0-0 "$URL"; then
            echo "配布物に到達できました"
          else
            echo "::warning::$URL に到達できません(未アップロード、または非公開リポジトリのため匿名ダウンロード不可)。サイトのダウンロードボタンとアプリ内アップデートが 404 になります。"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
