name: Youyaku
options:
  bundleIdPrefix: com.youyaku
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad

targets:
  Youyaku:
    type: application
    platform: iOS
    info:
      path: Youyaku/Info.plist
      properties:
        CFBundleDisplayName: Youyaku
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: 音声入力のためにマイクを使用します。
        NSSpeechRecognitionUsageDescription: 話した内容をテキストに変換するために音声認識を使用します。認識はデバイス上で行われます。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.youyaku.voiceinput.ios
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    sources:
      # iOS 専用コード
      - path: Youyaku
        excludes:
          - Info.plist
      # 第三者ライセンス表記(バンドルにリソースとして同梱)
      - path: ../THIRD_PARTY_LICENSES.txt
        buildPhase: resources
      - path: ../Sources/Youyaku/Support/Licenses.swift
      # ※ プライバシーマニフェスト(Youyaku/PrivacyInfo.xcprivacy)は上の `- path: Youyaku` に含まれる
      # macOS 版と共有するプラットフォーム非依存コア
      - path: ../Sources/Youyaku/Models/Settings.swift
      - path: ../Sources/Youyaku/Models/HistoryStore.swift
      - path: ../Sources/Youyaku/LLM/LlamaEngine.swift
      - path: ../Sources/Youyaku/LLM/Refiner.swift
      - path: ../Sources/Youyaku/LLM/BuiltinCatalog.swift
      - path: ../Sources/Youyaku/LLM/ModelStore.swift
      - path: ../Sources/Youyaku/Speech/SpeechRecognizer.swift
      - path: ../Sources/Youyaku/Support/L10n.swift
      - path: ../Sources/Youyaku/Support/Theme.swift
      - path: ../Sources/Youyaku/HUD/WaveformView.swift
    dependencies:
      - framework: ../Vendor/build-apple/llama.xcframework
        embed: true
