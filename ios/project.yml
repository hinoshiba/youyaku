name: Youyaku
options:
  bundleIdPrefix: com.hinoshiba
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.0.2"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: "94HVVWXLK3"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad

targets:
  Youyaku:
    type: application
    platform: iOS
    info:
      path: Youyaku/Info.plist
      properties:
        CFBundleDisplayName: Youyaku
        # XcodeGen は generate のたびに Info.plist を再生成する(手動編集は消える)ため、
        # 版数は必ずここで変数参照として指定する(Scripts/bump-version.sh が上の
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION を更新する)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: 音声入力のためにマイクを使用します。
        NSSpeechRecognitionUsageDescription: 話した内容をテキストに変換するために音声認識を使用します。認識はすべてこの端末上で行われ、音声が外部に送信されることはありません。/ Converts your speech to text. All recognition happens on this device; audio never leaves it.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hinoshiba.youyaku
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # 大きめの LLM モデルをロードするため、Extended Memory Limit を要求する
        CODE_SIGN_ENTITLEMENTS: Youyaku/Youyaku.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      # iOS 専用コード
      - path: Youyaku
        excludes:
          - Info.plist
          - Youyaku.entitlements   # 署名用ファイルなのでバンドルに含めない
          - Assets.xcassets        # 下で個別に追加(重複登録を避ける)
      # アプリアイコン等のアセットカタログ
      - path: Youyaku/Assets.xcassets
      # 第三者ライセンス表記(バンドルにリソースとして同梱)
      - path: ../THIRD_PARTY_LICENSES.txt
        buildPhase: resources
      - path: ../Sources/Youyaku/Support/Licenses.swift
      # ※ プライバシーマニフェスト(Youyaku/PrivacyInfo.xcprivacy)は上の `- path: Youyaku` に含まれる
      # macOS 版と共有するプラットフォーム非依存コア
      - path: ../Sources/Youyaku/Models/Settings.swift
      - path: ../Sources/Youyaku/Models/HistoryStore.swift
      - path: ../Sources/Youyaku/LLM/LlamaEngine.swift
      - path: ../Sources/Youyaku/LLM/Refiner.swift
      - path: ../Sources/Youyaku/LLM/BuiltinCatalog.swift
      - path: ../Sources/Youyaku/LLM/ModelStore.swift
      - path: ../Sources/Youyaku/Speech/SpeechRecognizer.swift
      - path: ../Sources/Youyaku/Support/L10n.swift
      - path: ../Sources/Youyaku/Support/Theme.swift
      - path: ../Sources/Youyaku/HUD/WaveformView.swift
    dependencies:
      - framework: ../Vendor/build-apple/llama.xcframework
        embed: true
