name: Koe
options:
  bundleIdPrefix: com.koe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad

targets:
  Koe:
    type: application
    platform: iOS
    info:
      path: Koe/Info.plist
      properties:
        CFBundleDisplayName: Koe
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: 音声入力のためにマイクを使用します。
        NSSpeechRecognitionUsageDescription: 話した内容をテキストに変換するために音声認識を使用します。認識はデバイス上で行われます。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.koe.voiceinput.ios
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    sources:
      # iOS 専用コード
      - path: Koe
        excludes:
          - Info.plist
      # macOS 版と共有するプラットフォーム非依存コア
      - path: ../Sources/Koe/Models/Settings.swift
      - path: ../Sources/Koe/Models/HistoryStore.swift
      - path: ../Sources/Koe/LLM/LlamaEngine.swift
      - path: ../Sources/Koe/LLM/Refiner.swift
      - path: ../Sources/Koe/LLM/BuiltinCatalog.swift
      - path: ../Sources/Koe/LLM/ModelStore.swift
      - path: ../Sources/Koe/Speech/SpeechRecognizer.swift
      - path: ../Sources/Koe/Support/L10n.swift
      - path: ../Sources/Koe/Support/Theme.swift
      - path: ../Sources/Koe/HUD/WaveformView.swift
    dependencies:
      - framework: ../Vendor/build-apple/llama.xcframework
        embed: true
